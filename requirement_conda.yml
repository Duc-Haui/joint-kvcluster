# ==============================================================================
# CONDA ENVIRONMENT: SqueezedAttention Pipeline
# ==============================================================================
# Python 3.10 | PyTorch 2.2.2+CUDA 12.1 | RAPIDS cuML 24.4
#
# Cách dùng:
#   conda env create -f requirement_conda.yml
#   conda activate sq310
#
# Yêu cầu: NVIDIA GPU (Compute Capability >= 7.0), Driver >= 530
# ==============================================================================

name: sq310
channels:
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  # ─── Python core ──────────────────────────────────────────────────────
  - python=3.10
  - pip
  - setuptools
  - wheel

  # ─── Thư viện toán & khoa học (conda quản lý tốt hơn pip) ──────────
  - blas=1.0=mkl
  - mkl
  - mkl-service
  - mkl_fft
  - mkl_random
  - intel-openmp
  - numpy=1.26.4
  - scipy=1.15.3

  # ─── Thư viện hệ thống (cần cho GPU & build C extensions) ──────────
  - _libgcc_mutex
  - _openmp_mutex
  - libgcc-ng
  - libstdcxx-ng
  - libffi
  - libzlib
  - zlib
  - zstd
  - bzip2
  - xz
  - lz4-c
  - openssl
  - ca-certificates
  - ncurses
  - readline
  - sqlite
  - tk
  - libuuid

  # ─── Thư viện đồ họa & GUI (cho matplotlib/plotting) ───────────────
  - matplotlib
  - pillow
  - freetype
  - libpng
  - jpeg
  - libtiff
  - libwebp-base
  - lcms2

  # ─── Build tools ────────────────────────────────────────────────────
  - ld_impl_linux-64
  - tbb
  - tbb-devel

  # ─── Pip packages ──────────────────────────────────────────────────
  - pip:
      # --- Extra index URLs (QUAN TRỌNG: cần cho torch+cu121 & NVIDIA) ---
      - --extra-index-url https://pypi.nvidia.com
      - --extra-index-url https://download.pytorch.org/whl/cu121

      # ─── PyTorch + CUDA 12.1 (LÕI - KHÔNG ĐƯỢC THAY ĐỔI) ──────────
      - torch==2.2.2+cu121
      - torchaudio==2.2.2+cu121
      - torchvision==0.17.2+cu121
      - triton==2.2.0

      # ─── NVIDIA CUDA Python bindings ────────────────────────────────
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-cupti-cu12==12.1.105
      - nvidia-cuda-nvrtc-cu12==12.1.105
      - nvidia-cuda-runtime-cu12==12.1.105
      - nvidia-cudnn-cu12==8.9.2.26
      - nvidia-cufft-cu12==11.0.2.54
      - nvidia-curand-cu12==10.3.2.106
      - nvidia-cusolver-cu12==11.4.5.107
      - nvidia-cusparse-cu12==12.1.0.106
      - nvidia-nccl-cu12==2.19.3
      - nvidia-nvjitlink-cu12==12.9.86
      - nvidia-nvtx-cu12==12.1.105
      - nvtx==0.2.15
      - cuda-bindings==12.9.7
      - cuda-pathfinder==1.5.5
      - cuda-python==12.9.7

      # ─── HuggingFace Transformers ecosystem ────────────────────────
      - transformers==4.40.0
      - tokenizers==0.19.1
      - accelerate==0.27.2
      - safetensors==0.8.0
      - huggingface-hub==0.36.2
      - datasets==2.19.2


      # ─── BitsAndBytes (cho NF4 quantization - Pruning) ─────────────
      - bitsandbytes==0.43.1

      # ─── RAPIDS cuML (GPU-accelerated KMeans clustering) ───────────
      # LƯU Ý: Bộ RAPIDS này yêu cầu pyarrow>=14,<15
      - cuml-cu12==24.4.0
      - cudf-cu12==24.4.1
      - cupy-cuda12x==12.3.0
      - dask-cudf-cu12==24.4.1
      - dask-cuda==24.4.0
      - pylibraft-cu12==24.4.0
      - raft-dask-cu12==24.4.0
      - rmm-cu12==24.4.0
      - pynvjitlink-cu12==0.7.0
      - rapids-dask-dependency==24.4.1
      - treelite==4.1.2

      # ─── Apache Arrow (PHẢI giữ phiên bản 14.x cho cudf) ──────────
      - pyarrow==14.0.2
      - pyarrow-hotfix==0.7

      # ─── Dask (distributed computing cho RAPIDS) ───────────────────
      - dask==2024.1.1
      - dask-expr==0.4.0
      - distributed==2024.1.1

      # ─── Data Science & ML ─────────────────────────────────────────
      - pandas==2.2.1
